[package]
name = "urdira-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
urdira-native-core = { path = "../crates/urdira-native-core" }
urdira-worker-protocol = { path = "../crates/urdira-worker-protocol" }

[workspace]
members = ["."]
resolver = "3"

[[bin]]
name = "worker_framing"
path = "fuzz_targets/worker_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "logical_digest"
path = "fuzz_targets/logical_digest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fact_delta_stream_batch"
path = "fuzz_targets/fact_delta_stream_batch.rs"
test = false
doc = false
bench = false
