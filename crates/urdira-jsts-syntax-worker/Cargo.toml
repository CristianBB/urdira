[package]
name = "urdira-jsts-syntax-worker"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[dependencies]
oxc_allocator = "=0.142.0"
oxc_ast = "=0.142.0"
oxc_ast_visit = { version = "=0.142.0", features = ["serialize"] }
oxc_parser = "=0.142.0"
oxc_semantic = "=0.142.0"
oxc_span = "=0.142.0"
oxc_syntax = "=0.142.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
urdira-jsts-typeflow = { version = "=0.1.0", path = "../urdira-jsts-typeflow" }
urdira-native-core = { version = "=0.1.0", path = "../urdira-native-core" }
urdira-worker-protocol = { version = "=0.1.0", path = "../urdira-worker-protocol" }
