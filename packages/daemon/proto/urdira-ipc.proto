syntax = "proto3";

package urdira.ipc.v2;

message IpcRequest {
  uint32 protocol_version = 1;
  string request_id = 2;
  string call = 3;
  string deadline_at = 4;
  string cancellation_id = 5;
  bytes payload = 6;
  uint64 max_bytes = 7;
  uint32 max_in_flight = 8;
}

message IpcResponse {
  uint32 protocol_version = 1;
  string request_id = 2;
  string outcome = 3;
  bytes payload = 4;
  string error_code = 5;
  string error_message = 6;
  bytes error_details = 7;
}

message IpcProgress {
  uint32 protocol_version = 1;
  string request_id = 2;
  string phase = 3;
  uint64 completed = 4;
  uint64 total = 5;
  string message = 6;
}

message ProcessByteChunk {
  uint32 protocol_version = 1;
  string stream_id = 2;
  uint32 sequence = 3;
  uint64 offset = 4;
  bytes payload = 5;
  bool final = 6;
  string cancellation_id = 7;
  uint64 max_bytes = 8;
  uint32 max_in_flight = 9;
  string chunk_kind = 10;
  uint64 max_in_flight_bytes = 11;
}

message SourceBytesChunk {
  ProcessByteChunk chunk = 1;
}

message FactDeltaChunk {
  ProcessByteChunk chunk = 1;
}
