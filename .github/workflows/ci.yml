name: CI

on:
  push:
    # A tagged release is verified again by publish.yml. Restricting this
    # workflow to branches avoids two full CI matrices for the same commit.
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: pnpm verify
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Build and smoke-test public npm packages
        run: pnpm package:npm:smoke
      - name: Upload inspected npm tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: release/npm/
          if-no-files-found: error
          retention-days: 14

  platform-tests:
    name: Platform tests (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run platform tests
        run: pnpm test

  windows-portability:
    name: Windows portability preflight
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Windows portability preflight
        run: pnpm preflight:windows
