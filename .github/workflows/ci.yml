name: CI

on:
  push:
    # A tagged release is verified again by publish.yml. Restricting this
    # workflow to branches avoids two full CI matrices for the same commit.
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust audit tools
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit Rust dependencies
        run: pnpm audit:native
      - name: Verify repository
        run: pnpm verify
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Build host native closure for npm smoke
        run: pnpm build:native
      - name: Build and smoke-test public npm packages
        run: pnpm package:npm:smoke
      - name: Upload inspected npm tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: release/npm/
          if-no-files-found: error
          retention-days: 14

  platform-tests:
    name: Platform tests (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host native closure
        run: pnpm build:native
      - name: Run CI test suite
        run: pnpm test:ci

  windows-portability:
    name: Windows portability preflight
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Windows portability preflight
        run: pnpm preflight:windows
