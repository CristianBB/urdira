name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: pnpm verify
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Build and smoke-test public npm packages
        run: pnpm package:npm:smoke
      - name: Upload inspected npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: release/npm/
          if-no-files-found: error
          retention-days: 14

  platform-tests:
    name: Platform tests (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            shard: 1/1
          - os: windows-latest
            shard: 1/2
          - os: windows-latest
            shard: 2/2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run platform test shard
        run: pnpm test --shard=${{ matrix.shard }}
