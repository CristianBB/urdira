[workspace]
members = [
  "crates/urdira-indexing-core",
  "crates/urdira-indexing-worker",
  "crates/urdira-jsts-indexing-engine",
  "crates/urdira-launcher",
  "crates/urdira-jsts-syntax-worker",
  "crates/urdira-jsts-typeflow",
  "crates/urdira-jsts-native-projection",
  "crates/urdira-native-core",
  "crates/urdira-native-node",
  "crates/urdira-worker-protocol",
  "crates/urdira-v4-spike",
  "crates/urdira-fs-watch",
  "crates/urdira-structural-store",
  "crates/urdira-source-frontier",
  "crates/urdira-tsgo-client",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[workspace.dependencies]
napi = { version = "=3.12.2", default-features = false, features = ["napi10", "serde-json"] }
napi-build = "=2.4.1"
napi-derive = "=3.6.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
unicode-normalization = "=0.1.25"
